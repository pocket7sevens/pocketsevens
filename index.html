<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>POCKET SEVENS</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preload" href="OPTIDelphian.otf" as="font" type="font/otf" crossorigin="anonymous">
</head>
<body>
  <header class="navbar">
    <img src="logo.png" alt="POCKET SEVENS LOGO" class="nav-logo" />
  </header>

  <div class="hero">
    <div class="ripple-wrapper">
      <img src="logo.png" alt="POCKET SEVENS LOGO" class="logo ripple" id="animated-logo" />
    </div>
    <a href="#shop" class="cta" onclick="playSound()">MORE</a>
  </div>

  <audio id="cave-sound" preload="auto">
    <source src="drop-in-cave.mp3" type="audio/mpeg" />
  </audio>

  <script>
    function playSound() {
      const audio = document.getElementById('cave-sound');
      audio.volume = 0.3;
      audio.play();

      setInterval(() => {
        const logo = document.getElementById('animated-logo');
        logo.classList.remove('ripple');
        void logo.offsetWidth;
        logo.classList.add('ripple');
      }, 1000);
    }
  </script>
</body>
</html>
